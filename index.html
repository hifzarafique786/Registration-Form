<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: 'Times New Roman', Times, serif; background: #eef2f1; }
    .page { width: 100%; height: 100%; border-collapse: collapse; }
    .top, .bottom { background: rgb(235, 156, 235); color: black; text-align: center; padding: 18px; }
    .top, .bottom { height: 70px; }
    .login { background: rgb(254, 217, 254); border: 1px solid #c9d6d3; padding: 10px; }
    .login td { padding: 8px 10px; }
    .login input[type=text], .login input[type=password] { width: 220px; padding: 7px; }
    body {
        background-color: rgb(254, 217, 254);
    }
  </style>
</head>
<body>

<table class="page">

  <!-- HEADER -->
  <tr>
    <td class="top">
      <h1 style="margin:0;">My Website</h1>
      <p style="margin:4px 0 0;">Login &amp; Registration</p>
    </td>
  </tr>

  <!-- CENTER CONTENT -->
  <tr>
    <td align="center" valign="middle">
      <form action="index2.html" method="get">
        <table class="login">
          <tr>
            <td colspan="2" align="center"><h2 style="margin:0;">Login</h2></td>
          </tr>
          <tr>
            <td><label for="u">Username</label></td>
            <td><input type="text" id="u" name="username" required></td>
          </tr>
          <tr>
            <td><label for="p">Password</label></td>
            <td><input type="password" id="p" name="password" required></td>
          </tr>
          <tr>
            <td colspan="2" align="center"><input type="submit" value="Submit"></td>
          </tr>
        </table>
      </form>
    </td>
  </tr>

  <!-- FOOTER -->
  <tr>
    <td class="bottom">&copy; 2026 My Website. All rights reserved.</td>
  </tr>

</table>

</body>
</html>
